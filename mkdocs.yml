site_name: "CRM interno en Java puro con Vaadin Flow"
site_description: "Taller de 70 minutos: un CRM con Vaadin Flow 25, Signals y Spring Boot, todo en Java."
site_author: "Geovanny Mendoza"
site_url: "https://geovannymcode.github.io/stockpilot-vaadin-baqjug/"

repo_name: "geovannymcode/stockpilot-vaadin-baqjug"
repo_url: "https://github.com/geovannymcode/stockpilot-vaadin-baqjug"

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Inicio: index.md
  - Sesiones:
      - "Sesión 0 — Preparación y apertura": sesion_0.md
      - "Sesión 1 — Primera vista, componentes y layouts": sesion_1.md
      - "Sesión 2 — Mostrar datos en un Grid": sesion_2.md
      - "Sesión 3 — Filtrar con Signals": sesion_3.md
      - "Sesión 4 — Formulario, Binder y validación": sesion_4.md
      - "Sesión 5 — Guardar, descartar, crear y eliminar": sesion_5.md
      - "Sesión 6 — Conectar la base de datos real": sesion_6.md
      - "Sesión 7 — App shell y navegación": sesion_7.md
      - "Sesión 8 — Estilos, tema Aura y cierre": sesion_8.md
  - Referencias: referencias.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/geovannymcode
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/geovannycode/
